syntax = "proto2";

package robo_dragons_cafe.network.proto.ssl.grsim;
option java_package = "robo_dragons_cafe.network.proto.ssl.grsim";

message Status {
  repeated RobotStatus robots_status = 1;
}

message RobotStatus {
  required int32 robot_id  = 1;
  required bool infrared   = 2;
  required bool flat_kick  = 3;
  required bool chip_kick  = 4;
}
